<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thalyn&reg; World Viewer</title>
<link rel="icon" href="/thalyn_figure_gold.png" />
<!--
  Thalyn® World Viewer — a three.js glTF (.glb) viewer.

  A .glb stores geometry + baked PBR materials. This viewer adds the lighting a
  glTF file does not store — sky, sun, ambient IBL, tone mapping, an optional
  foliage wind shimmer, and animated water/lava — so a world looks its best in a
  browser. A Thalyn export may also carry its own sky (a baked dome) and the
  camera the picture was taken from; both are honoured here. Built on three.js only.

  Loads one or many .glb at once (drag-drop / file picker / ?model=URL); drop a
  whole export folder and it reassembles at the origin. Supports KTX2 (Basis),
  Meshopt and Draco. Embedded in /demo/ via an <iframe> + postMessage bridge.
-->
<style>
  :root { --gold: #E8C66A; --ink: #0d1411; --panel: rgba(13,20,17,0.82); --ash: #9DBCAC; --line: rgba(232,198,106,0.30); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1411; color: #e8efe9;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); font-size: 13px; line-height: 1.5; user-select: none; }
  #hud { top: 14px; left: 14px; width: 252px; padding: 14px 16px; max-height: calc(100vh - 28px); overflow-y: auto; }
  #hud h1 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0.04em; color: var(--gold); font-weight: 600; }
  #hud .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; gap: 8px; }
  #hud label { color: #cfe0d7; }
  #hud .stat { color: var(--ash); font-variant-numeric: tabular-nums; text-align: right; }
  #hud input[type=range] { width: 110px; accent-color: var(--gold); }
  #hud input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; }
  #hud select { background: rgba(255,255,255,0.06); color: #e8efe9; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  #hud button { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; cursor: pointer;
    background: rgba(232,198,106,0.14); color: var(--gold); border: 1px solid rgba(232,198,106,0.45); font-size: 13px; }
  #hud button:hover { background: rgba(232,198,106,0.24); }
  #hud button:focus-visible, #b-fs:focus-visible, #cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #hud .sub { color: var(--ash); font-size: 12px; margin: -2px 0 6px; }
  #drop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .15s; background: rgba(13,20,17,0.55);
    border: 3px dashed var(--gold); font-size: 22px; color: var(--gold); z-index: 5; }
  #drop.show { opacity: 1; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 16px; font-size: 13px; color: #e8efe9; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #empty { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; text-align: center; color: var(--ash); pointer-events: none; }
  #empty .big { font-size: 20px; color: var(--gold); }
  a { color: var(--gold); }
  #b-fs { position: fixed; right: 14px; bottom: 14px; z-index: 10; width: 40px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    color: var(--gold); backdrop-filter: blur(8px); }
  #b-fs:hover { background: rgba(232,198,106,0.18); border-color: rgba(232,198,106,0.55); }
  #b-fs svg { width: 20px; height: 20px; display: block; }
  #b-fs .fs-exit { display: none; }
  #b-fs.is-fs .fs-enter { display: none; }
  #b-fs.is-fs .fs-exit { display: block; }
  #cta { position: fixed; right: 64px; bottom: 14px; z-index: 10; padding: 9px 14px; text-decoration: none;
    background: rgba(232,198,106,0.16); border: 1px solid rgba(232,198,106,0.5); border-radius: 10px; color: var(--gold);
    font-size: 13px; backdrop-filter: blur(8px); display: none; }
  #cta:hover { background: rgba(232,198,106,0.28); }
  #cta.show { display: block; }
  #title { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 6; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.2s; }
  #title.show { opacity: 1; }
  #title .n { font: 600 28px/1.1 Georgia, serif; color: var(--gold); letter-spacing: 0.04em; text-shadow: 0 2px 18px rgba(0,0,0,0.7); }
  #title .s { font-size: 13px; color: #e8efe9; opacity: 0.85; text-shadow: 0 1px 8px rgba(0,0,0,0.8); margin-top: 4px; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--gold); opacity: 0; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
  body.walking #cross { opacity: 0.9; }
  body.walking #hud, body.walking #cta, body.walking #b-fs { opacity: 0.2; pointer-events: none; }
  body.clean #hud, body.clean #cta, body.clean #b-fs, body.clean #title { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross" aria-hidden="true"></div>
<div id="title" aria-hidden="true"><div class="n" id="title-n"></div><div class="s" id="title-s"></div></div>

<div id="hud" class="panel">
  <h1>Thalyn&reg; World Viewer</h1>
  <div class="row"><label>Meshes</label><span class="stat" id="s-meshes">0</span></div>
  <div class="row"><label>Triangles</label><span class="stat" id="s-tris">0</span></div>
  <div class="row" id="w-row" style="display:none"><label id="w-name" title="World name">World</label><span class="stat" id="w-tone"></span></div>
  <div class="sub" id="w-sky" style="display:none"></div>
  <button id="b-postcard" style="display:none" title="Copy the postcard code — paste it into Thalyn to regrow this world">Copy postcard code</button>
  <button id="b-shot" style="display:none" title="Walk to where the picture was taken (V leaves)">Stand where the picture was taken</button>
  <div class="row"><label><input type="checkbox" id="t-cinema" checked /> Cinematic</label>
    <span class="stat" id="s-grade"></span></div>
  <div class="row"><label>Weather</label>
    <select id="r-weather" title="As exported, or try another sky on this world">
      <option value="">As exported</option>
      <option value="Clear">Clear</option>
      <option value="Cloudy">Cloudy</option>
      <option value="Foggy">Foggy</option>
      <option value="LightRain">Light rain</option>
      <option value="HeavyRain">Heavy rain</option>
      <option value="Storm">Storm</option>
      <option value="Snow">Snow</option>
      <option value="Blizzard">Blizzard</option>
      <option value="Dust">Dust</option>
      <option value="Ash">Ash</option>
    </select></div>
  <details id="w-details" style="display:none"><summary>World details</summary>
    <div class="sub" id="w-details-body" style="white-space:pre-line; margin-top:4px"></div></details>
  <div class="row"><label><input type="checkbox" id="t-wind" /> Wind</label>
    <input type="range" id="r-wind" min="0" max="2" step="0.05" value="1" /></div>
  <div class="row"><label><input type="checkbox" id="t-sky" checked /> Sky &amp; sun</label></div>
  <div class="row"><label><input type="checkbox" id="t-fog" /> Haze / mist</label>
    <input type="range" id="r-fog" min="0" max="2" step="0.02" value="1" /></div>
  <div class="row"><label><input type="checkbox" id="t-rotate" /> Auto-rotate</label></div>
  <div class="row"><label>Sun</label><input type="range" id="r-sun" min="0.05" max="0.95" step="0.01" value="0.55" /></div>
  <div class="row"><label>Tone</label>
    <select id="r-tone">
      <option value="aces">Filmic (ACES)</option>
      <option value="agx">AgX (neutral)</option>
      <option value="reinhard">Reinhard</option>
      <option value="linear">Linear</option>
      <option value="none">None (raw)</option>
    </select></div>
  <div class="row"><label>Exposure</label><input type="range" id="r-exp" min="0.3" max="2" step="0.05" value="1" /></div>
  <button id="b-walk">Walk (V)</button>
  <button id="b-reset">Reset view</button>
  <button id="b-open">Open .glb…</button>
  <div class="sub" style="margin-top:8px">H hides the panels for a clean shot.</div>
</div>

<div id="empty">
  <div class="big">Drop a Thalyn world (.glb) here</div>
  <div>or click “Open .glb…” &nbsp;·&nbsp; drop a whole export folder’s files at once</div>
</div>
<div id="drop">Release to load</div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<a id="cta" href="https://store.steampowered.com/app/4581800/Thalyn/" target="_blank" rel="noopener">Built in Thalyn — make yours ↗</a>
<button id="b-fs" type="button" aria-label="Enter fullscreen" title="Fullscreen">
  <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>
<input type="file" id="file" accept=".glb,.gltf" multiple style="display:none" />

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as TA from './thalyn-atmos.js';

const CDN = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/';
const $ = id => document.getElementById(id);

// Honour the OS "reduce motion" preference: when set, the render loop freezes the
// ambient wind/water/lava animation (user-driven orbit/zoom still respond).
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const coarsePointer = matchMedia('(pointer: coarse)').matches;

// ── Renderer / scene / camera ────────────────────────────────────────────────
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100000);
camera.position.set(40, 30, 40);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 60000;

// IBL so baked-PBR materials read correctly even before the sky is added; a baked sky dome replaces it.
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = roomEnv;
const skyEnv = TA.makeSkyEnv(renderer, scene, roomEnv);

// ── Sky + sun + hemisphere + stars (lighting a .glb does not store) ─────────
const L = TA.makeLights();
let skyOn = true;
function setSky(on) {
  skyOn = on;
  if (on) { scene.add(L.sky, L.sun, L.hemi, L.stars); if (skyEnv.active) scene.background = skyEnv.active; }
  else { scene.remove(L.sky, L.sun, L.hemi, L.stars); scene.background = new THREE.Color(0x0d1411); }
  L.sky.visible = !skyEnv.active;
}

// ── Atmosphere state: what the world asked for, plus the HUD's own overrides ─
let post = null; // cinematic pass, created once the renderer is sized (below)
let worldRadius = 100;
let state = TA.defaultState(worldRadius);   // the applied state
let fogOn = false, fogScale = 1;
function apply() {
  const s = Object.assign({}, state);
  s.fogDensity = state.fogDensity * fogScale * weather.fogMul;   // heavy weather thickens the haze
  s.sunIntensity = state.sunIntensity * weather.sunDim;          // …and dims the sun
  if (weather.fogMul > 1.05 && !(state.fogDensity > 0)) s.fogDensity = (1.2 / Math.max(1, worldRadius)) * (weather.fogMul - 1);
  kit.uWindStrength.value = Math.max(kit.uWindStrength.value, weather.windFloor * 1.4); // storms lean the trees
  TA.applyState(s, L, renderer, scene, fogOn || weather.fogMul > 1.05);
  L.sky.visible = skyOn && !skyEnv.active;
  $('r-exp').value = renderer.toneMappingExposure;
  $('r-sun').value = Math.min(0.95, Math.max(0.05, state.sunDir.y));
  $('t-fog').checked = fogOn;
  if (post) { post.setTone(state.tone); post.setNight(state.night); $('s-grade').textContent = state.tone; }
}

// ── The Thalyn block ─────────────────────────────────────────────────────────
let pendingThalyn = null, pendingAtmos = null;
let anchorRoot = null, shotPose = null;
const kit = TA.makeMaterialKit();
const weather = TA.makeWeather(scene, camera);
let fileWeather = '', weatherOverride = '';
const _sunV = new THREE.Vector3();
function setWeather() { weather.set(weatherOverride || fileWeather); apply(); }
// World details: everything the file says about itself, in one flat panel.
function fillDetails(tx) {
  const el = $('w-details'), body = $('w-details-body');
  if (!el || !body) return;
  const st = tx.stats || {};
  const rows = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '' && v !== 0) rows.push(k + ': ' + v); };
  add('Mood', tx.tone); add('Time', tx.clock); add('Weather', tx.weather);
  if (Array.isArray(st.worldSizeMetersXZ) && st.worldSizeMetersXZ.length === 2)
    add('Size', Math.round(st.worldSizeMetersXZ[0]) + ' × ' + Math.round(st.worldSizeMetersXZ[1]) + ' m' + (st.sizeTier ? ' (' + st.sizeTier + ')' : ''));
  if (st.worldAreaM2 > 0) add('Ground', (st.worldAreaM2 / 10000).toFixed(1) + ' ha');
  add('Terrain', st.topologyCategory);
  if (st.biomeCount > 0) add('Biomes', st.biomeCount + (Array.isArray(st.biomeNames) && st.biomeNames.length ? ' — ' + st.biomeNames.slice(0, 8).join(', ') : ''));
  if (Array.isArray(st.species))
    for (const s of st.species.slice(0, 8)) if (s && s.count > 0) add(String(s.name || '').replace(/^Species_/, ''), s.count.toLocaleString());
  if (st.speciesTotal > 0) add('Living things', st.speciesTotal.toLocaleString());
  add('Seed', tx.seed || st.worldSeed);
  if ((tx.anchors || []).length) add('Placed by hand', tx.anchors.length);
  add('Exported', (tx.exportedAt || '').slice(0, 10));
  el.style.display = rows.length ? '' : 'none';
  body.textContent = rows.join('\n');
}

// Older numeric block (sun/fog/wind) — still honoured when no full block is present.
function applyAtmosphere(a) {
  if (!a || typeof a !== 'object') return;
  pendingAtmos = a;
  const s = TA.defaultState(worldRadius);
  const t = (typeof a.timeOfDay === 'number' && a.timeOfDay >= 0) ? a.timeOfDay : 0.55;
  const elev = (t < 0.25 || t > 0.75) ? 0.06 : 0.06 + 0.9 * Math.sin((t - 0.25) / 0.5 * Math.PI);
  TA.sunFromElevation(s, elev);
  const sc = TA.rgbOf(a.sunColor); if (sc) s.sunColor.copy(sc);
  if (a.sunIntensity > 0) s.sunIntensity = Math.min(4, Math.max(0.15, a.sunIntensity));
  const amb = TA.rgbOf(a.ambientColor);
  if (amb && (a.ambientColor[0] + a.ambientColor[1] + a.ambientColor[2]) > 0.15) s.hemiSky.copy(amb);
  if (a.ambientIntensity > 0) s.hemiIntensity = Math.min(2, Math.max(0.05, a.ambientIntensity));
  if (a.fogEnabled && Array.isArray(a.fogColor)) {
    s.fogColor.copy(TA.rgbOf(a.fogColor));
    const mode = (a.fogMode || '').toLowerCase();
    s.fogDensity = (mode.includes('linear') && a.fogEnd > a.fogStart) ? 3 / a.fogEnd : (a.fogDensity > 0 ? a.fogDensity : 1.2 / Math.max(1, worldRadius));
    fogOn = true;
  }
  if (a.skyboxExposure > 0) s.exposure = Math.min(2.5, Math.max(0.3, a.skyboxExposure));
  if (a.windStrength > 0 && !reduceMotion.matches) {
    $('t-wind').checked = true; const w = Math.min(2, a.windStrength * 0.4); $('r-wind').value = w; kit.uWindStrength.value = w;
  }
  s.night = (t < 0.22 || t > 0.8) ? 1 : 0;
  state = s; apply();
  toast('Applied Thalyn atmosphere');
}
async function fetchAtmos(url) {
  try { const r = await fetch(url); const j = await r.json(); applyAtmosphere(j.atmosphere || j); }
  catch (e) { console.warn('[atmos] fetch failed', e); toast('Atmosphere load failed (CORS?)'); }
}

function applyThalynBlock(tx) {
  if (!TA.hasBlock(tx)) return;
  pendingThalyn = tx;
  try {
    state = TA.stateFromBlock(tx, worldRadius);
    fogOn = state.fogDensity > 0;
    fileWeather = tx.weather || '';
    const wsel = $('r-weather'); if (wsel && !weatherOverride) wsel.value = '';
    weather.set(weatherOverride || fileWeather);
    fillDetails(tx);
    apply();
    if (tx.water && tx.water.present) TA.tintWater(tx.water, worldRoot, kit.lavaMats);
    if (anchorRoot && anchorRoot.parent) anchorRoot.parent.remove(anchorRoot);
    anchorRoot = TA.buildAnchors(tx.anchors, worldRoot);
    // HUD: world name · tone · clock · weather, the postcard code, the shot.
    const name = String(tx.worldName || tx.sceneName || 'Thalyn world').slice(0, 40);
    $('w-row').style.display = '';
    $('w-name').textContent = name;
    $('w-tone').textContent = [tx.tone, tx.clock, tx.weather].filter(Boolean).join(' · ');
    const skyLine = $('w-sky');
    skyLine.style.display = '';
    skyLine.textContent = (skyEnv.active ? 'Lit by its own sky' : 'Procedural sky') + (state.night > 0.5 ? ' · night' : '');
    const pc = $('b-postcard');
    const code = typeof tx.postcard === 'string' ? tx.postcard.trim() : '';
    pc.style.display = code ? '' : 'none';
    pc.onclick = async () => { try { await navigator.clipboard.writeText(code); toast('Postcard code copied: ' + code); }
                               catch (e) { toast('Copy failed — ' + code); } };
    shotPose = TA.cameraPose(tx);
    $('b-shot').style.display = (shotPose && !coarsePointer) ? '' : 'none';
    showTitle(name, [tx.tone, tx.clock, tx.weather].filter(Boolean).join(' · '));
    $('cta').classList.add('show');
    console.info('[thalyn] extras.thalyn applied ' + JSON.stringify({ tone: tx.tone, clock: tx.clock, weather: tx.weather, anchors: (tx.anchors || []).length, dome: !!skyEnv.active, shot: !!shotPose, night: +state.night.toFixed(2) }));
  } catch (e) { console.warn('[thalyn] extras block apply failed (ignored)', e); }
}

let titleT;
function showTitle(name, sub) {
  $('title-n').textContent = name; $('title-s').textContent = sub || '';
  const el = $('title'); el.classList.add('show'); clearTimeout(titleT);
  titleT = setTimeout(() => el.classList.remove('show'), 5200);
}

TA.sunFromElevation(state, 0.55);
apply();
setSky(true);

// ── Loaders (KTX2 + Meshopt + Draco → loads gltfpack-optimised output too) ───
const ktx2 = new KTX2Loader().setTranscoderPath(CDN + 'libs/basis/').detectSupport(renderer);
const draco = new DRACOLoader().setDecoderPath(CDN + 'libs/draco/');
const loader = new GLTFLoader();
loader.setKTX2Loader(ktx2);
loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);

// ── World root + load ────────────────────────────────────────────────────────
let worldRoot = new THREE.Group();
scene.add(worldRoot);
const walkMeshes = [];
const groundAt = TA.makeGroundProbe(walkMeshes);

function clearWorld() {
  scene.remove(worldRoot);
  worldRoot.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
  worldRoot = new THREE.Group();
  scene.add(worldRoot);
  walkMeshes.length = 0;
  kit.reset();
  skyEnv.useDome(null);
}

// Dispose the old world AND zero the HUD readouts, so a fully-failed load doesn't leave stale counts.
function resetWorld() {
  clearWorld();
  meshCount = 0; triCount = 0;
  $('s-meshes').textContent = '0';
  $('s-tris').textContent = '0';
}

// Restore lighting/fog/wind/exposure to the viewer's defaults so a world with no atmosphere block
// (or fewer fields) does not inherit the previous world's atmosphere when switching.
function resetAtmosphere() {
  pendingAtmos = null; pendingThalyn = null; anchorRoot = null; shotPose = null;
  $('w-row').style.display = 'none'; $('w-sky').style.display = 'none';
  $('b-postcard').style.display = 'none'; $('b-shot').style.display = 'none';
  state = TA.defaultState(worldRadius); TA.sunFromElevation(state, 0.55);
  fogOn = false; fogScale = 1; kit.uWindStrength.value = 0;
  fileWeather = ''; weather.set(weatherOverride || '');
  const wd = $('w-details'); if (wd) { wd.style.display = 'none'; wd.open = false; }
  $('t-wind').checked = false; $('r-wind').value = 1; $('r-fog').value = 1;
  apply();
}

let meshCount = 0, triCount = 0;
function ingest(gltf) {
  // A baked sky dome travels as an ordinary mesh so every viewer shows it; here it becomes the sky itself.
  const dome = TA.extractSkyDome(gltf.scene);
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      meshCount++;
      const g = o.geometry;
      if (g && g.index) triCount += g.index.count / 3;
      else if (g && g.attributes.position) triCount += g.attributes.position.count / 3;
      if (kit.upgradeLiquid(o)) return; // animated water/lava — no wind sway
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => kit.patchFoliage(m, o.name));
    }
  });
  // This viewer supplies its own sun + sky + IBL, so strip any punctual lights baked into the file
  // (present for DCC tools) to avoid double-lighting.
  const bakedLights = [];
  gltf.scene.traverse(o => { if (o.isLight) bakedLights.push(o); });
  bakedLights.forEach(l => l.parent && l.parent.remove(l));
  const tx = TA.readBlock(gltf);
  if (tx && tx.atmosphere && !pendingAtmos && !TA.hasBlock(tx)) applyAtmosphere(tx.atmosphere);
  worldRoot.add(gltf.scene);
  if (dome) { skyEnv.useDome(dome); L.sky.visible = false; }
  if (tx) applyThalynBlock(tx); // after the meshes are under worldRoot (water tint / anchors need them)
  $('s-meshes').textContent = meshCount.toLocaleString();
  $('s-tris').textContent = Math.round(triCount).toLocaleString();
}

function rebuildWalkMeshes() {
  walkMeshes.length = 0;
  worldRoot.updateMatrixWorld(true);
  worldRoot.traverse(o => { if (o.isMesh && !o.userData.__liquid && TA.isGroundMesh(o)) walkMeshes.push({ mesh: o, box: new THREE.Box3().setFromObject(o) }); });
}

function frameWorld(honourShot = true) {
  // Frame on terrain + species, NOT liquids — an infinite water/lava plane extends far past the
  // world and would otherwise blow up the box (camera zooms out, world becomes a speck).
  worldRoot.updateMatrixWorld(true);
  const box = new THREE.Box3();
  let any = false;
  worldRoot.traverse(o => { if (o.isMesh && !o.userData.__liquid) { box.expandByObject(o); any = true; } });
  if (!any) box.setFromObject(worldRoot);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 10;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5));
  camera.near = Math.max(0.05, radius / 1000);
  camera.far = Math.max(dist * 8, 20000);
  camera.updateProjectionMatrix();
  worldRadius = radius;
  rebuildWalkMeshes();
  if (pendingAtmos && !pendingThalyn) applyAtmosphere(pendingAtmos); // re-apply now that worldRadius is known
  if (pendingThalyn) applyThalynBlock(pendingThalyn);                 // the full block wins
  if (honourShot && shotPose) {
    // Open on the picture: the orbit camera stands where the shot was taken, looking the same way.
    camera.position.copy(shotPose.position);
    controls.target.copy(shotPose.position).addScaledVector(shotPose.forward, 30);
    if (shotPose.fov) { camera.fov = shotPose.fov; camera.updateProjectionMatrix(); }
    toast('Opened from where the picture was taken · “Reset view” frames the world');
  } else {
    controls.target.copy(center);
    camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.7);
  }
  controls.update();
}

function loadFromURL(url, name) {
  toast('Loading ' + (name || url) + ' …');
  loader.load(url, gltf => { ingest(gltf); frameWorld(); toast('Loaded ' + (name || '') ); $('empty').style.display = 'none';
      postUp({ type: 'thalyn:loaded', label: name || '', meshes: meshCount }); },
    undefined, err => { console.error(err); toast('Failed: ' + (err?.message || err));
      postUp({ type: 'thalyn:error', message: 'This world could not be loaded.' }); });
}

const MAX_GLB_BYTES = 2_000_000_000; // ~1.86 GiB — a single .glb above this won't fit a browser ArrayBuffer (~2 GB cap)
async function loadFiles(fileList) {
  // Reject oversized files up front (before touching the current view) with actionable guidance.
  const oversized = [...fileList].filter(f => /\.(glb|gltf)$/i.test(f.name) && f.size > MAX_GLB_BYTES);
  if (oversized.length) {
    const gb = (Math.max(...oversized.map(f => f.size)) / 1073741824).toFixed(1);
    const msg = `File too large (${gb} GB) — a browser can't open a .glb over ~2 GB. Open the optimised web export (e.g. World_web.glb) instead.`;
    toast(msg); postUp({ type: 'thalyn:error', message: msg });
    return;
  }
  resetAtmosphere(); // reset scene + HUD before the manifest parse below (a dropped manifest's atmosphere survives)
  const all = [...fileList];
  const jsonFile = all.find(f => /\.json$/i.test(f.name)); // a dropped .json sidecar → atmosphere
  if (jsonFile) {
    try { const j = JSON.parse(await jsonFile.text()); applyAtmosphere(j.atmosphere || j); }
    catch (e) { console.warn('[atmos] json parse', e); }
  }
  const files = all.filter(f => /\.(glb|gltf)$/i.test(f.name));
  if (!files.length) return;
  resetWorld();
  $('empty').style.display = 'none';
  // Map sibling files (so a .gltf + its .bin/textures dropped together resolve).
  const byName = new Map(files.map(f => [f.name, f]));
  const siblingURLs = [];
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((u) => {
    const base = u.split('/').pop().split('?')[0];
    if (byName.has(base)) { const o = URL.createObjectURL(byName.get(base)); siblingURLs.push(o); return o; }
    return u;
  });
  const fl = new GLTFLoader(manager);
  fl.setKTX2Loader(ktx2); fl.setDRACOLoader(draco); fl.setMeshoptDecoder(MeshoptDecoder);
  let done = 0;
  for (const f of files) {
    const url = URL.createObjectURL(f);
    await new Promise(res => fl.load(url, g => { ingest(g); done++; toast(`Loaded ${done}/${files.length}`); URL.revokeObjectURL(url); res(); },
      undefined, e => { console.error(f.name, e); done++; URL.revokeObjectURL(url); res(); }));
  }
  siblingURLs.forEach(u => URL.revokeObjectURL(u)); // free .bin/texture blob URLs created by the URL modifier
  frameWorld();
  toast(`Loaded ${done} file(s) — ${meshCount.toLocaleString()} meshes`);
  postUp(meshCount ? { type: 'thalyn:loaded', label: '', meshes: meshCount }
                   : { type: 'thalyn:error', message: 'That file could not be loaded.' });
}

// ── Walk mode ────────────────────────────────────────────────────────────────
const walk = TA.makeWalk(camera, document.body, groundAt, (on, why) => {
  document.body.classList.toggle('walking', on);
  controls.enabled = !on;
  $('b-walk').textContent = on ? 'Orbit (V)' : 'Walk (V)';
  if (on) toast('WASD to walk · Shift to run · E/Q up/down · F back to ground · Esc or V to leave');
  else if (why === 'refused') toast('Pointer lock refused — try V again in a second');
  else { const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); controls.target.copy(camera.position).addScaledVector(fwd, 30); controls.update(); }
});
if (coarsePointer) $('b-walk').style.display = 'none';
function toggleWalk() {
  if (walk.active) { walk.exit(); return; }
  if (!walkMeshes.length) { toast('Load a world first'); return; }
  const t = controls.target.clone();
  walk.enterAt(new THREE.Vector3(t.x, t.y, t.z + 6), new THREE.Vector3(t.x, t.y, t.z - 20));
}
$('b-walk').onclick = toggleWalk;
$('b-shot').onclick = () => { if (shotPose && walkMeshes.length) walk.enterPose(shotPose); };

// ── UI wiring ────────────────────────────────────────────────────────────────
const dropEl = $('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('show'); });
addEventListener('dragleave', e => { if (e.target === document || e.relatedTarget === null) dropEl.classList.remove('show'); });
addEventListener('drop', e => { e.preventDefault(); dropEl.classList.remove('show'); if (e.dataTransfer?.files?.length) loadFiles(e.dataTransfer.files); });
$('b-open').onclick = () => $('file').click();
$('file').onchange = e => loadFiles(e.target.files);
$('b-reset').onclick = () => { walk.exit(); frameWorld(false); };
$('t-wind').onchange = e => { kit.uWindStrength.value = e.target.checked ? parseFloat($('r-wind').value) : 0; };
$('r-wind').oninput = e => { if ($('t-wind').checked) kit.uWindStrength.value = parseFloat(e.target.value); };
$('t-sky').onchange = e => setSky(e.target.checked);
$('t-fog').onchange = e => { fogOn = e.target.checked; if (fogOn && !(state.fogDensity > 0)) state.fogDensity = 1.2 / Math.max(1, worldRadius); apply(); };
$('r-fog').oninput = e => { fogScale = parseFloat(e.target.value); apply(); };
$('t-rotate').onchange = e => { controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 0.6; };
$('r-sun').oninput = e => { TA.sunFromElevation(state, parseFloat(e.target.value)); apply(); };
$('t-cinema').onchange = e => { post.setEnabled(e.target.checked); };
$('r-weather').onchange = e => { weatherOverride = e.target.value; setWeather(); toast(weatherOverride ? 'Weather: ' + e.target.options[e.target.selectedIndex].text : 'Weather: as exported'); };
// Live colour controls — tone mapping shapes saturation/contrast; exposure = brightness.
// (Tone mapping is compiled into each material's shader, so a change must flag loaded materials for recompile.)
const TONEMAPS = { aces: THREE.ACESFilmicToneMapping, agx: THREE.AgXToneMapping, reinhard: THREE.ReinhardToneMapping, linear: THREE.LinearToneMapping, none: THREE.NoToneMapping };
function setToneMapping(mode) {
  renderer.toneMapping = TONEMAPS[mode] ?? THREE.ACESFilmicToneMapping;
  worldRoot.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m) m.needsUpdate = true; }); });
}
$('r-tone').onchange = e => setToneMapping(e.target.value);
$('r-exp').oninput = e => { state.exposure = parseFloat(e.target.value); renderer.toneMappingExposure = state.exposure; };

addEventListener('keydown', e => {
  if (!walk.onKey(e, true)) return;
  if (e.code === 'KeyV') { toggleWalk(); }
  else if (e.code === 'KeyH') { document.body.classList.toggle('clean'); }
});
addEventListener('keyup', e => walk.onKey(e, false));

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// ── Cinematic pass (bloom + per-tone grade) ──────────────────────────────────
post = TA.makePost(renderer, scene, camera);
function resizeToViewport() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  post.resize(innerWidth, innerHeight);
}
addEventListener('resize', resizeToViewport);
resizeToViewport();

// ── Fullscreen toggle (bottom-right) ──────────────────────────────────────────
// Works standalone and embedded (the parent iframe carries allow="fullscreen").
const fsBtn = $('b-fs');
fsBtn.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => toast('Fullscreen is not available here.'));
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  fsBtn.classList.toggle('is-fs', on);
  fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
  requestAnimationFrame(resizeToViewport); // re-fit the canvas once the viewport has changed
});

// ── Embed bridge ──────────────────────────────────────────────────────────────
// When this viewer is embedded in an <iframe> (the /demo/ page), the parent drives it via
// postMessage instead of reloading the frame. Same-origin only.
function postUp(msg) { try { if (parent && parent !== window) parent.postMessage(msg, location.origin); } catch (e) {} }
function loadURLFresh(url, label) {
  resetWorld(); resetAtmosphere();
  loadFromURL(url, label);
}
addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'thalyn:ping') { postUp({ type: 'thalyn:ready' }); return; }
  if (d.type === 'thalyn:loadURL' && d.url) { loadURLFresh(d.url, d.label); }
  else if (d.type === 'thalyn:loadFiles' && d.files && d.files.length) { loadFiles(d.files); }
});
postUp({ type: 'thalyn:ready' }); // announce once on startup (parent also pings as a fallback)

// ?model=URL deep link + ?atmos=URL for a sidecar atmosphere block + &cta=0 to hide the store link.
// Only allow https: or same-origin URLs — a deep link must not make the page fetch arbitrary
// schemes (javascript:/data:/file:) or be used to render attacker content under this domain.
function safeURL(raw) {
  try { const u = new URL(raw, location.href);
    if (u.protocol === 'https:' || u.origin === location.origin) return u.href;
  } catch (e) {}
  return null;
}
const params = new URLSearchParams(location.search);
$('cta').href = TA.steamLink(parent && parent !== window ? 'demo_embed' : 'viewer');
if (params.get('cta') === '0') $('cta').style.display = 'none';
const qp = params.get('model');
if (qp) { const s = safeURL(qp); if (s) loadFromURL(s); else toast('That world link is not allowed.'); }
const atmosUrl = params.get('atmos');
if (atmosUrl) { const s = safeURL(atmosUrl); if (s) fetchAtmos(s); }

// ── Render loop ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta());
  if (!reduceMotion.matches) {           // freeze ambient wind/water/lava/weather motion under "reduce motion"
    kit.tick(dt);
    TA.tickAnchors(anchorRoot, kit.uWindTime.value);
    weather.tick(dt, kit.uWindStrength.value);
  }
  // Sun shafts: aim the radial pass at the sun's screen position; fade out off-screen / at night / in weather.
  _sunV.copy(state.sunDir).multiplyScalar(2000).add(camera.position).project(camera);
  const shaftsOn = skyOn && weather.shaftsOk && state.sunDir.y > 0.04 && state.night < 0.5
    && _sunV.z < 1 && Math.abs(_sunV.x) < 1.25 && Math.abs(_sunV.y) < 1.25;
  post.setSunScreen((_sunV.x + 1) / 2, (_sunV.y + 1) / 2, shaftsOn ? 0.55 : 0);
  if (walk.active) walk.step(dt); else controls.update();
  post.render();
});
</script>
</body>
</html>
